services:
  passkey:
    build: .
    user: "${PUID:-10001}:${PGID:-10001}"
    ports:
      - "3100:3100"
    environment:
      DATABASE_PATH: /app/data/vault.db
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
